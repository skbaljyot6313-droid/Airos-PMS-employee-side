apply plugin: 'com.android.application'

// Single authoritative version source: frontend/app.json
//   expo.version            -> versionName
//   expo.android.versionCode -> versionCode (monotonically increasing)
// The release workflow (release-android.yml) bumps app.json; Gradle and
// the update-check flow both read from it — no second version source.
def appJson = new groovy.json.JsonSlurper()
        .parse(rootProject.file("../app.json"))
def appVersionName = appJson.expo.version
def appVersionCode = appJson.expo.android.versionCode as Integer

// Signing identity for EVERY installable build (debug and release) — PINNED. Every installed build only accepts
// updates signed by the same certificate (AppUpdatePlugin rejects others
// with WRONG_SIGNATURE, and Android refuses them anyway). Gradle's default
// ~/.android/debug.keystore is generated per machine/container/CI runner,
// which silently changed the signer between releases 20 and 21. Builds now
// sign with android/dev-debug.keystore (gitignored; CI materializes it from
// a secret) — SHA-256 5A:CF:78:D3:…:79:B1 — or AIROS_DEV_KEYSTORE if set.
def devKeystoreFile = System.getenv("AIROS_DEV_KEYSTORE") ?
        file(System.getenv("AIROS_DEV_KEYSTORE")) :
        rootProject.file("dev-debug.keystore")

android {
    namespace "com.airos.staff"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.theairco.airos.employee"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            if (devKeystoreFile.exists()) {
                storeFile devKeystoreFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
}

// Fail closed: a debug or release APK signed by a random per-machine key can
// never update installed devices. Refuse to package one instead of shipping it.
gradle.taskGraph.whenReady { graph ->
    def packagesDebug = graph.allTasks.any { it.project == project && it.name in ["packageDebug", "packageRelease"] }
    if (packagesDebug && !devKeystoreFile.exists()) {
        throw new GradleException(
                "Pinned dev signing key missing: ${devKeystoreFile}. " +
                "Restore android/dev-debug.keystore (or set AIROS_DEV_KEYSTORE) — " +
                "building with a fresh debug key breaks in-app updates (WRONG_SIGNATURE).")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Fused Location Provider for the background tracking service;
    // LocationManager fallback covers Play-Services-less devices.
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // FCM — required by @capacitor/push-notifications; inert until
    // google-services.json lands (plugin apply is conditional below).
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
