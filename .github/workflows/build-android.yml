name: Build Android APK

# Deliberate mobile releases only — every backend push should NOT produce an APK.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build type"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
      api_url:
        description: "VITE_API_URL baked into the bundle"
        required: true
        default: "https://airos-eb-api-dev-94363806721.asia-south1.run.app/api/v1"
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # Public API base baked into the bundle — never a secret. This copy is
      # detached from the old Railway production deployment; point this at your
      # own backend URL for real device builds (localhost works for web only).
      - name: Build web bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ inputs.api_url }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # ONE signing identity for every installable APK (debug and release).
      # A second key would be a different signer and break in-app updates
      # (WRONG_SIGNATURE). Secret holds base64 of frontend/android/dev-debug.keystore.
      - name: Restore pinned signing key
        working-directory: frontend/android
        env:
          DEV_DEBUG_KEYSTORE_BASE64: ${{ secrets.DEV_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEV_DEBUG_KEYSTORE_BASE64" || { echo "::error::secret DEV_DEBUG_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$DEV_DEBUG_KEYSTORE_BASE64" | base64 -d > dev-debug.keystore

      - name: Assemble APK (pinned signing key)
        working-directory: frontend/android
        run: bash ./gradlew assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} --no-daemon

      - name: Verify APK signer is the pinned identity
        working-directory: frontend/android
        run: |
          APK=app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | \
            grep -q "SHA-256 digest: 5acf78d3ff65781af7fcd667b081ba107bc7d142f87fe08660ff8859e34379b1" || \
            { echo "::error::APK is not signed by the pinned identity (5acf78…) — do not distribute"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airos-employee-${{ inputs.build_type }}.apk
          path: frontend/android/app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk
          if-no-files-found: error
