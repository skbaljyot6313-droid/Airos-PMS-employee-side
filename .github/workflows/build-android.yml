name: Build Android APK

# Deliberate mobile releases only — every backend push should NOT produce an APK.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build type"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
      api_url:
        description: "VITE_API_URL baked into the bundle"
        required: true
        default: "https://airos-eb-api-dev-94363806721.asia-south1.run.app/api/v1"
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # Public API base baked into the bundle — never a secret. This copy is
      # detached from the old Railway production deployment; point this at your
      # own backend URL for real device builds (localhost works for web only).
      - name: Build web bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ inputs.api_url }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Pinned dev signing key — a runner-generated debug key can never
      # update installed devices (WRONG_SIGNATURE). Secret holds
      # base64 of frontend/android/dev-debug.keystore.
      - name: Restore pinned dev signing key
        if: inputs.build_type == 'debug'
        working-directory: frontend/android
        env:
          DEV_DEBUG_KEYSTORE_BASE64: ${{ secrets.DEV_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEV_DEBUG_KEYSTORE_BASE64" || { echo "::error::secret DEV_DEBUG_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$DEV_DEBUG_KEYSTORE_BASE64" | base64 -d > dev-debug.keystore

      - name: Assemble debug APK (pinned dev keystore)
        if: inputs.build_type == 'debug'
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      # Release builds need a keystore provided via secrets:
      #   KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_ALIAS,
      #   KEYSTORE_KEY_PASSWORD
      - name: Restore release keystore
        if: inputs.build_type == 'release'
        working-directory: frontend/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/airos-employee-release.keystore
          cat > keystore.properties <<EOF
          storeFile=airos-employee-release.keystore
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Assemble release APK (signed)
        if: inputs.build_type == 'release'
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airos-employee-${{ inputs.build_type }}.apk
          path: frontend/android/app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk
          if-no-files-found: error
