name: Build Android APK

# Deliberate mobile releases only — every backend push should NOT produce an APK.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build type"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # Public API base baked into the bundle — never a secret.
      - name: Build web bundle against production API
        run: npm run build
        env:
          VITE_API_URL: https://employee-api-production-c0e3.up.railway.app/api/v1

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK (auto-signed debug keystore)
        if: inputs.build_type == 'debug'
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      # Release builds need a keystore provided via secrets:
      #   KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_ALIAS,
      #   KEYSTORE_KEY_PASSWORD
      - name: Restore release keystore
        if: inputs.build_type == 'release'
        working-directory: frontend/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/airos-employee-release.keystore
          cat > keystore.properties <<EOF
          storeFile=app/airos-employee-release.keystore
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Assemble release APK (signed)
        if: inputs.build_type == 'release'
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airos-employee-${{ inputs.build_type }}.apk
          path: frontend/android/app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk
          if-no-files-found: error
