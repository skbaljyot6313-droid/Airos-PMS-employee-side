name: Configure Centrifugo variables

# Sets the realtime variables on the employee-api Railway service.
# employee-api lives in a different Railway project than the Centrifugo
# service, so publishes go over the public HTTPS API URL.
#
# Required repo secrets (same values as the super-admin repo):
#   CENTRIFUGO_TOKEN_SECRET  == Centrifugo client HMAC secret
#   CENTRIFUGO_API_KEY       == Centrifugo HTTP API key
#
# Inputs come from the super-admin deploy-centrifugo run summary.

on:
  workflow_dispatch:
    inputs:
      centrifugo_domain:
        description: "Centrifugo public domain (e.g. centrifugo-production-xxxx.up.railway.app)"
        required: true

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  CENTRIFUGO_TOKEN_SECRET: ${{ secrets.CENTRIFUGO_TOKEN_SECRET }}
  CENTRIFUGO_API_KEY: ${{ secrets.CENTRIFUGO_API_KEY }}

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Set variables on employee-api
        env:
          DOMAIN: ${{ inputs.centrifugo_domain }}
        run: |
          set -e
          if [ -z "$CENTRIFUGO_TOKEN_SECRET" ] || [ -z "$CENTRIFUGO_API_KEY" ]; then
            echo "::error::Set repo secrets CENTRIFUGO_TOKEN_SECRET and CENTRIFUGO_API_KEY first"
            exit 1
          fi
          echo "::add-mask::$CENTRIFUGO_TOKEN_SECRET"
          echo "::add-mask::$CENTRIFUGO_API_KEY"
          railway variable set --service employee-api \
            "CENTRIFUGO_URL=https://$DOMAIN" \
            "CENTRIFUGO_WS_URL=wss://$DOMAIN/connection/websocket" \
            "CENTRIFUGO_API_KEY=$CENTRIFUGO_API_KEY" \
            "CENTRIFUGO_TOKEN_SECRET=$CENTRIFUGO_TOKEN_SECRET" \
            "LOCATION_PUBLISH_MIN_INTERVAL_SECONDS=8" \
            --json

      - name: Verify realtime token endpoint
        env:
          DOMAIN: ${{ inputs.centrifugo_domain }}
        run: |
          sleep 45
          R=$(curl -sf "https://$DOMAIN/health" || true)
          echo "centrifugo health: $R"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://employee-api-production-c0e3.up.railway.app/api/v1/realtime/token")
          echo "unauthenticated /realtime/token status: $CODE"
          [ "$CODE" = "401" ] || [ "$CODE" = "403" ] || exit 1
